type: video_preprocessor
max_queue_size: null
max_batch_size: 1
instance_count: 1
frame_interval: 2
use_half_precision: false
max_pending_frames: auto             # Max preprocessed frames held in memory per video before pausing to let the models catch up. auto = sized from RAM (preprocess_ram_fraction over preprocess_assumed_concurrency videos); a number pins it.
preprocess_backend: av_auto  # av_auto (default: seek when interval>=1s, threaded otherwise), av_seek, av, deffcode_auto, deffcode, deffcode_gpu
gpu_min_long_edge: 36000            # deffcode_auto: use GPU when video long edge >= this (0 = always GPU)
decode_workers: 0                   # ffmpeg_parallel: parallel ffmpeg decode processes for true-interval sampling (0 = auto: min(8, cpu_count))
decode_threads_per_worker: 0        # decoder threads in each decode worker (0 = auto: cpu_count // decode_workers, at most 8)
