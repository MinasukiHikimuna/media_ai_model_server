type: video_preprocessor
max_queue_size: null
max_batch_size: 1
instance_count: 1
frame_interval: 2
use_half_precision: false
max_pending_frames: auto             # Max preprocessed frames held in memory per video before pausing to let the models catch up. auto = sized from RAM; a number pins it.
max_pending_memory_gb: 4            # ...and at most this many GB of them per video, whatever their size (0 = no byte bound).
preprocess_backend: av_auto  # av_auto (default: seek when interval>=1s, threaded otherwise), av_seek, av, deffcode_auto, deffcode, deffcode_gpu
gpu_min_long_edge: 36000            # deffcode_auto: use GPU when video long edge >= this (0 = always GPU)
decode_workers: 0                   # ffmpeg_parallel: parallel ffmpeg decode processes for true-interval sampling (0 = auto: min(8, cpu_count))
decode_threads_per_worker: 0        # decoder threads in each decode worker (0 = auto: cpu_count // decode_workers, at most 8)
max_concurrent_dense_decodes: 1     # every-frame decodes (shot boundaries) running at once across the server; others wait (0 = no limit)
dense_decode_backend: pyav          # every-frame decodes: pyav (CPU, in the decode workers) or ffmpeg_cuda (NVDEC beside them; falls back to pyav)
dense_decode_quality: fast          # ffmpeg_cuda: fast (shrink sources over 1920 on the GPU) or exact (same frames as pyav, slower at 8K); see ffmpeg_pipe.plan_scale
